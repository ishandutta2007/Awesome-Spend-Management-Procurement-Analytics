<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#091322" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="glowTeal" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Card / Element Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barGradGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barGradPurple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes barWave {
      0%, 100% { transform: scaleY(0.92); }
      50% { transform: scaleY(1.08); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pillSlide {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(6px); }
    }

    .pulsing-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }
    .float-card-left {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .float-card-right {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .wave-bar-1 {
      transform-origin: bottom;
      animation: barWave 3s ease-in-out infinite alternate;
    }
    .wave-bar-2 {
      transform-origin: bottom;
      animation: barWave 3.5s ease-in-out infinite alternate 0.5s;
    }
    .wave-bar-3 {
      transform-origin: bottom;
      animation: barWave 2.8s ease-in-out infinite alternate 1s;
    }
    .flow-line {
      stroke-dasharray: 8, 6;
      animation: dashTravel 2s linear infinite;
    }
    .pill-dynamic {
      animation: pillSlide 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs -->
  <circle cx="200" cy="100" r="280" fill="url(#glowTeal)" class="pulsing-glow" />
  <circle cx="1020" cy="260" r="300" fill="url(#glowIndigo)" class="pulsing-glow" />
  <circle cx="600" cy="320" r="260" fill="url(#glowEmerald)" class="pulsing-glow" />

  <!-- Subtle High-Tech Grid Pattern in Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Dynamic Curved Flow Connection (Behind Main Text) -->
  <path class="flow-line" d="M 120,290 C 350,350 400,280 600,310 C 800,340 920,290 1080,240" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" />

  <!-- Decorative Left Card (Floating Analytics Mini-Chart) -->
  <g class="float-card-left" transform="translate(60, 65)">
    <rect width="190" height="150" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="24" cy="26" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="26" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="52" cy="26" r="5" fill="#10b981" opacity="0.8"/>
    <text x="70" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">SPEND METRICS</text>

    <!-- Mini Analytics Chart Bars -->
    <g transform="translate(24, 60)">
      <rect class="wave-bar-1" x="0" y="25" width="22" height="45" rx="4" fill="url(#barGrad)" />
      <rect class="wave-bar-2" x="32" y="10" width="22" height="60" rx="4" fill="url(#barGradGreen)" />
      <rect class="wave-bar-3" x="64" y="35" width="22" height="35" rx="4" fill="url(#barGradPurple)" />
      <rect class="wave-bar-1" x="96" y="5" width="22" height="65" rx="4" fill="url(#barGrad)" />
      <rect class="wave-bar-2" x="128" y="20" width="22" height="50" rx="4" fill="url(#barGradGreen)" />
    </g>
  </g>

  <!-- Decorative Right Card (Floating Procurement Automation Card) -->
  <g class="float-card-right" transform="translate(950, 75)">
    <rect width="190" height="145" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="20" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">⚡ P2P ENGINE</text>
    
    <!-- Status rows -->
    <g transform="translate(20, 50)">
      <rect width="150" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="10" r="4" fill="#34d399" />
      <text x="24" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">PO 3-Way Match: OK</text>
    </g>
    <g transform="translate(20, 78)">
      <rect width="150" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="10" r="4" fill="#60a5fa" />
      <text x="24" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">AI Invoice Intake: Active</text>
    </g>
    <g transform="translate(20, 106)">
      <rect width="150" height="20" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="10" r="4" fill="#a78bfa" />
      <text x="24" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="9" font-weight="500">Savings Rate: +23.4%</text>
    </g>
  </g>

  <!-- Dynamic Animated Badges / Pills (Lower Center Foreground) -->
  <g class="pill-dynamic" transform="translate(270, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="28" y="22" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Spend Analytics</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(160, 0)">
      <rect width="155" height="34" rx="17" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <circle cx="16" cy="17" r="4" fill="#34d399" />
      <text x="28" y="22" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI Procurement</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(330, 0)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5" />
      <circle cx="16" cy="17" r="4" fill="#a855f7" />
      <text x="28" y="22" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 Card &amp; AP Control</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(510, 0)">
      <rect width="150" height="34" rx="17" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <circle cx="16" cy="17" r="4" fill="#fbbf24" />
      <text x="28" y="22" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Open-Source ERP</text>
    </g>
  </g>

  <!-- Primary Foreground Content: Title and Subtitle (Crisp and Always in Foreground) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Category Micro Tag -->
    <rect x="-140" y="-36" width="280" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="-19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CURATED ENTERPRISE &amp; OSS GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="32" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      Awesome Spend Management &amp; Procurement Analytics
    </text>

    <!-- Subtitle -->
    <text x="0" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
      Enterprise SaaS Platforms, Autonomous AI Agents, and Open-Source P2P Systems
    </text>

    <!-- Metadata Accent Line -->
    <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
      ⚡ Spend Visibility • Automated Approvals • 3-Way Matching • Sourcing Intelligence
    </text>
  </g>
</svg>
